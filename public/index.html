<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Scanner</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>OCR Scanner</h1>
      <p>Pull the text out of a photo, screenshot or scanned page.</p>
    </header>

    <section class="card">
      <form id="form">
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/jpeg,image/png,image/gif">
          <span id="prompt">Drop an image here, or click to choose one</span>
          <span class="hint">JPG, PNG or GIF, up to 4 MB</span>
        </label>
        <button id="go" disabled>Extract text</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>

    <footer>Built with <a href="https://apiverve.com/marketplace/imagetotext">Image to Text API</a> from APIVerve</footer>
  </main>
</body>
</html>
